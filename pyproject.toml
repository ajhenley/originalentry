[project]
name = "originalentry"
version = "0.1.0"
description = "Original Entry — a browser-based accounting system simulation for Principles of Financial Accounting (Riverbend Ledger build)"
requires-python = ">=3.13"
readme = "README.md"

# Runtime dependencies are pinned with hashes in requirements.txt (T16).
# This list mirrors them for tooling that reads pyproject.
dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Migrate>=4,<5",
    "Flask-Login>=0.6,<0.7",
    "Flask-WTF>=1.2,<2",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "requests>=2.31,<3",
    "gunicorn>=21,<24",
    "sentry-sdk[flask]>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
    "Pillow>=10,<12",   # generator image rendering (used in tests)
]
# Laptop-only: the pack generator's image renderers (T16 allows a generator-only dependency).
# Pillow draws a document for a pack with no printed artefact behind it; WeasyPrint photographs
# the real one, by rendering the paper set's own html through the paper set's own stylesheet.
# WeasyPrint has had no write_png since v53, so that path goes html -> pdf -> raster, and the
# rasteriser is poppler's `pdftoppm` (`brew install poppler`) — not a Python package, so it
# cannot be declared here. scripts/render_documents.py refuses with that sentence when either is
# missing. Neither is needed to run the app or to import a pack.
generator = [
    "Pillow>=10,<12",
    "WeasyPrint>=60",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["originalentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Real Postgres is required for integration/isolation/guard DB tests (T17.1).
# Pure engine + money + schema tests run with no database.
markers = [
    "db: test requires a real Postgres database",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["originalentry", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
