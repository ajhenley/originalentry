{% extends "layouts/auth.html" %}
{% block title %}Sign in · Parchment{% endblock %}

{% block auth %}
<h1 class="text-lg font-semibold">Sign in</h1>

<form method="post" action="{{ url_for('auth.sign_in') }}" class="mt-4 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div>
    <label for="email" class="field-label">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required
           class="field mt-1">
  </div>
  <label class="flex items-start gap-2 text-sm">
    <input type="checkbox" name="keep_signed_in" value="1" class="mt-1">
    <span>Keep me signed in on this computer for 14 days — not on a shared or lab computer.</span>
  </label>
  <button type="submit" class="btn btn--primary">Email me a sign-in link</button>
</form>

<p class="mt-4 text-sm text-muted">
  We send a link and a six-digit code. Using either signs you in.
  <a class="underline" href="{{ url_for('auth.code_form') }}">Have a code already?</a>
</p>
<p class="mt-2 text-sm text-muted">
  New here? <a class="underline" href="{{ url_for('auth.join_form') }}">Join with a class code.</a>
</p>
{% endblock %}
