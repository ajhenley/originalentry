{% extends "layouts/auth.html" %}
{% block title %}Join a section · Parchment{% endblock %}

{% block auth %}
<h1 class="text-lg font-semibold">Join with a class code</h1>
<p class="mt-2 text-sm text-muted">
  Your instructor gives you the code. We email you a link to finish — your account opens when you
  follow it.
</p>
<form method="post" action="{{ url_for('auth.join') }}" class="mt-4 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div>
    <label for="code" class="block text-sm font-medium">Join code</label>
    <input id="code" name="code" required autocomplete="off"
           class="mt-1 w-full rounded border border-rule px-3 py-2 uppercase tracking-wide">
  </div>
  <div class="flex gap-3">
    <div class="flex-1">
      <label for="given_name" class="block text-sm font-medium">First name</label>
      <input id="given_name" name="given_name" required autocomplete="given-name"
             class="mt-1 w-full rounded border border-rule px-3 py-2">
    </div>
    <div class="flex-1">
      <label for="family_name" class="block text-sm font-medium">Last name</label>
      <input id="family_name" name="family_name" required autocomplete="family-name"
             class="mt-1 w-full rounded border border-rule px-3 py-2">
    </div>
  </div>
  <div>
    <label for="email" class="block text-sm font-medium">Email address</label>
    <input id="email" name="email" type="email" required autocomplete="email"
           class="mt-1 w-full rounded border border-rule px-3 py-2">
  </div>
  <button type="submit" class="rounded bg-company px-4 py-2 text-paper">Send my sign-in link</button>
</form>
<p class="mt-4 text-sm text-muted">
  Already have an account? <a class="underline" href="{{ url_for('auth.sign_in_form') }}">Sign in.</a>
</p>
{% endblock %}
