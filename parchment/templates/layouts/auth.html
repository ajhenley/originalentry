{% extends "base.html" %}

{% block main %}
<div class="mx-auto max-w-md">
  <p class="mb-2 font-display text-3xl text-navy">Parchment</p>
  <p class="label-meta mb-8">An accounting practice set</p>
  {% with flashes = get_flashed_messages() %}
    {% if flashes %}
    <div class="mb-4 space-y-2">
      {% for m in flashes %}
      <p class="callout" role="status">{{ m }}</p>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}
  <div class="panel p-6">
    {% block auth %}{% endblock %}
  </div>
</div>
{% endblock %}
